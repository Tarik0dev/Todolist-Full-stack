<div class="view">
  <div class="form">
    <div class="group-header">
      <div class="header">
        <img src="logo.png" alt="logo" width="40px" />
        <h1>TaskFlow</h1>
      </div>
      <h2>Mot de passe oublié ?</h2>
      <h3>Saisissez votre adresse email pour recevoir un lien de réinitialisation.</h3>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
      <div class="group-input">
        <label for="email">Adresse mail </label>
        <div class="input-wrapper">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input id="email" type="email" formControlName="email" placeholder="nom@domaine.com" />
        </div>
      </div>

      <small
        class="error"
        [class.visible]="
          forgotForm.controls.email.invalid &&
          (forgotForm.controls.email.dirty || forgotForm.controls.email.touched)
        "
      >
        Veuillez saisir une adresse email valide
      </small>

      <button type="submit" class="button-blue" [disabled]="forgotForm.invalid">
        Envoyer le lien
      </button>
        <div>
  <div class="separation-bottom"></div>
  <p class="light-blue-text center">  <span class="material-symbols-outlined back-icon">arrow_back</span>
    <a routerLink="/" class="back-link">
    
      Retour à la connexion
    </a>
  </p>

</div>
    </form>
